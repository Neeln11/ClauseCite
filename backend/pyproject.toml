[project]
name = "clausecite-backend"
version = "0.1.0"
description = "Ask your contracts, get cited answers - grounded Q&A with resolvable citations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "alembic>=1.14.0",
    "pymupdf>=1.24.13",
    "tiktoken>=0.8.0",
    "openai>=1.55.0",
    "anthropic>=0.40.0",
    "azure-storage-blob>=12.24.0",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "python-multipart>=0.0.17",
    "tenacity>=9.0.0",
    "httpx>=0.27.2",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "reportlab>=4.2.5",
    "types-pyyaml>=6.0.12",
    "greenlet>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "RUF012", # ClassVar annotations not required on Pydantic model config
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The stopword sets are written as one wrapped string and split at import: a
# list literal of 50 one-word strings is materially harder to read and edit.
"app/services/provider.py" = ["SIM905"]
"app/services/retrieve.py" = ["SIM905"]
"alembic/*" = ["E501", "N806"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "pgvector.*", "prometheus_fastapi_instrumentator.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "requires_db: integration test needing a live Postgres with pgvector (set TEST_DATABASE_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["app/workers/*", "alembic/*"]
