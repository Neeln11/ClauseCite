# Replaces /etc/nginx/nginx.conf entirely (not conf.d/default.conf) so the
# `user` directive can be dropped and the pid moved somewhere the non-root
# `app` user can write — both required to run this as USER app in the image.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json image/svg+xml;

    # nginx needs somewhere writable for these; /tmp is the one place granted
    # to the non-root user in the Dockerfile.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Fingerprinted build assets (Vite's dist/assets/*) are safe to cache
        # forever; index.html is not, or a deploy would never reach a client.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
